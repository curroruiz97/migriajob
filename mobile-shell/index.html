    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #100e51;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
      }
      .logo { display: block; height: 34px; width: auto; }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e5ebff;
        border-top-color: #2a56fb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .hint { font-size: 13px; color: #676e7e; max-width: 320px; line-height: 1.5; }
      .btn {
        margin-top: 6px;
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #2a56fb;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        cursor: pointer;
      }
      .btn:active { background: #0435eb; }
      .btn.outline {
        background: transparent;
        color: #2a56fb;
        border: 1px solid #2a56fb;
      }
      .diag {
        margin-top: 12px;
        max-width: 340px;
        font-size: 11px;
        color: #4b5163;
        background: rgba(0,0,0,0.04);
        padding: 10px 12px;
        border-radius: 10px;
        text-align: left;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        word-break: break-all;
      }
      [hidden] { display: none !important; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

      <div class="hint" id="fail-msg">No hemos podido cargar la aplicación. Pulsa el botón para abrirla.</div>
      <button class="btn" onclick="goRemote(true)">Abrir Talnet</button>
      <button class="btn outline" onclick="retry()">Reintentar</button>
      <div class="diag" id="diag"></div>
    </div>

    <script>
      // URL de la web (debe coincidir con server.url de capacitor.config.ts)
      var REMOTE = 'https://migriajob.vercel.app/bienvenida';

      function showFallback(reason) {
        document.getElementById('loading').hidden = true;
        var fb = document.getElementById('fallback');
        fb.hidden = false;
        var diag = document.getElementById('diag');
        diag.textContent =
          'Motivo: ' + reason + '\n' +
          'URL: ' + REMOTE + '\n' +
          'UA: ' + (navigator.userAgent || '-') + '\n' +
          'Capacitor: ' + (window.Capacitor ? 'sí' : 'no') + '\n' +
          'Online: ' + (navigator.onLine ? 'sí' : 'no');
      }

      function goRemote(force) {
        try {
          window.location.replace(REMOTE);
        } catch (e) {
          showFallback('navegación lanzó: ' + (e && e.message ? e.message : e));
        }
      }

      function retry() {
        document.getElementById('loading').hidden = false;
        document.getElementById('fallback').hidden = true;
        startNavigation();
      }

      // Si Capacitor está disponible, él ya está manejando la navegación al server.url.
      // Si no aparece tras 1.5s, asumimos que NO estamos en Capacitor (web puro) o
      // hubo un fallo y hacemos la navegación manualmente.
      function startNavigation() {
        var attempted = false;
        var timer = setTimeout(function () {
          if (attempted) return;
          attempted = true;
          // Si Capacitor no llegó a navegar, lo hacemos nosotros.
          goRemote(false);
        }, 1500);

        // Si pasa más tiempo y seguimos aquí, mostramos fallback con diagnóstico.
        setTimeout(function () {
          if (document.getElementById('loading').hidden) return;
          showFallback('timeout 8s — el WebView no abandonó esta pantalla');
        }, 8000);
      }

      window.addEventListener('error', function (e) {
        showFallback('error JS: ' + (e && e.message ? e.message : 'desconocido'));
      });

      startNavigation();
    </script>
