# Comprobación automática de cada cambio.
#
# POR QUÉ EXISTE
# Hasta ahora no había ninguna: cada push a main se desplegaba directo a
# producción y la única verificación era que Vercel consiguiera compilar. Los
# fallos se descubrían usando la aplicación —el botón que no hacía nada, el
# logotipo que se borraba al guardar, la foto de cámara que reventaba la
# subida—, y varios los encontró el propio socio en producción.
#
# Esto no sustituye a unas pruebas, que siguen sin existir. Lo que hace es
# barato y vale la pena igual: si un cambio rompe los tipos o el build, se ve
# en el pull request y no en la web.
#
# El build corre SIN variables de entorno a propósito. La aplicación está
# escrita para arrancar sin Supabase configurado (lib/supabase/server.ts
# devuelve un stub), así que si alguien introduce una dependencia que reviente
# sin claves, salta aquí en vez de en el despliegue.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la comprobación del anterior: no tiene sentido esperar
# a que termine de verificar un commit que ya ha quedado atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # El proyecto usa bun: el único lockfile versionado es bun.lock, y el
      # .gitignore descarta a propósito package-lock.json, yarn.lock y
      # pnpm-lock.yaml. Instalar con npm aquí daría una instalación distinta
      # de la de producción, que es justo lo que un CI no debe hacer.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Comprobar tipos
        run: bunx tsc --noEmit

      - name: Pruebas
        # Las de humo necesitan la clave pública del sitio para comprobar que
        # la base de datos sigue cerrada a los anónimos. Es pública por diseño
        # —va dentro del JavaScript de la web— pero no se guarda en el
        # repositorio: se pone como secreto SMOKE_ANON_KEY en GitHub y las tres
        # comprobaciones se activan solas. Sin él, se saltan.
        env:
          SMOKE_ANON_KEY: ${{ secrets.SMOKE_ANON_KEY }}
        run: bun test

      - name: Build de producción
        run: bunx next build
